name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_structure.py

  clab-documents:
    name: clab documents compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clab
        # clab is not on PyPI, and its pyproject pins nnterp to a local path, so nnterp
        # comes from GitHub first and clab is installed without dependency resolution.
        # Compiling a document needs no model, so no weights are downloaded.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5" pytest "nnsight>=0.8.2" safetensors pydantic accelerate "datasets>=4"
          pip install "nnterp @ git+https://github.com/ndif-team/nnterp@e5d0f8e755c6c04ce7c84eeab2832e2ef8dfce20"
          pip install --no-deps "clab @ git+https://github.com/JadenFiotto-Kaufman/clab@830182f"
      - run: pytest -q tests/test_documents.py

  code-blocks:
    name: skill code blocks (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v1
      - name: Install
        # nnsight 0.8 is not on PyPI yet (latest release is 0.7.0), so install the
        # branch. Switch to `pip install "nnsight>=0.8"` once it ships.
        #
        # transformers>=5 is a hard requirement, not a preference: in 4.x a GPT-2
        # block returns `(hidden_states,)` and its attention dropout is
        # `module.attn_dropout(...)`, so the `.output` and `.source` examples
        # throughout these skills are wrong on 4.x.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5" pytest pillow
          pip install "nnsight @ git+https://github.com/ndif-team/nnsight@0.8"
          pip install "nnterp @ git+https://github.com/ndif-team/nnterp@v2.0.0"
      - name: Report versions
        run: python plugins/nnsight/skills/nnsight/scripts/check_env.py
      # No CUDA and no NDIF deployment on the runner, so `gpu` and `remote`
      # blocks skip; everything else runs against real weights.
      - run: pytest -q tests/test_skills.py
