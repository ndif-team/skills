name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_structure.py

  code-blocks:
    name: skill code blocks (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-gpt2
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "nnsight>=0.8" pytest
      # No CUDA and no NDIF deployment on the runner, so `gpu` and `remote`
      # blocks are skipped; everything else runs against real gpt2 weights.
      - run: pytest -q tests/test_skills.py
